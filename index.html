
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART MONEY PRO V5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#e8eefc;font-family:Arial,sans-serif}
header{padding:16px;background:#111c30;border-bottom:1px solid #263653}
h2{margin:0;color:#42d9ff}
.sub{color:#9aabc5;font-size:12px;margin-top:6px}
.wrap{padding:12px;max-width:1200px;margin:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,button{padding:11px;border-radius:7px;border:1px solid #344665;background:#14223a;color:white}
button{background:#087cbd;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#111c30;border:1px solid #263653;border-radius:10px;padding:13px;margin-bottom:10px}
.card h3{margin:0 0 10px;color:#42d9ff}
.price{font-size:22px;font-weight:bold}
.green{color:#16df91}
.red{color:#ff5268}
.yellow{color:#ffce58}
.muted{color:#91a2bd;font-size:12px}
.signal{border-left:4px solid #16df91}
.badSignal{border-left:4px solid #ff5268}
.condition{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #263653;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:9px 5px;border-bottom:1px solid #263653;text-align:left}
th{color:#42d9ff}
.section{margin-top:18px}
.status{font-size:12px;margin-top:8px}
.news{padding:9px 0;border-bottom:1px solid #263653;font-size:13px}
@media(max-width:600px){.grid{grid-template-columns:1fr}table{font-size:11px}}
</style>
</head>
<body>
<header>
<h2>⚡ SMART MONEY PRO V5</h2>
<div class="sub">FOUR INDEX CE / PE OPTIONS SCANNER</div>
<div class="status" id="connection">Connecting to server...</div>
</header>

<div class="wrap">
<div class="toolbar">
<input id="api" style="flex:1;min-width:220px"
value="https://YOUR-RENDER-URL.onrender.com"
placeholder="Render server URL">
<button onclick="saveURL()">Connect</button>
<button onclick="refreshAll()">Refresh</button>
<button onclick="toggleSound()" id="soundBtn">Sound: OFF</button>
</div>

<div class="grid" id="indexes">
<div class="card">Loading index data...</div>
</div>

<div class="section">
<div class="card">
<h3>🚨 ACTIVE SIGNALS</h3>
<div id="active">Loading signals...</div>
</div>
</div>

<div class="section">
<div class="card">
<h3>📊 LATEST SCAN</h3>
<div id="scan">Waiting for scan data...</div>
</div>
</div>

<div class="section">
<div class="card">
<h3>📰 LIVE MARKET NEWS</h3>
<div id="news">Loading news...</div>
</div>
</div>

<div class="section">
<div class="card">
<h3>📜 SIGNAL HISTORY</h3>
<div style="overflow-x:auto">
<table>
<thead><tr>
<th>Time</th><th>Index</th><th>Signal</th>
<th>Entry</th><th>Status</th>
</tr></thead>
<tbody id="history">
<tr><td colspan="5">Loading history...</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</div>

<script>
let BASE = localStorage.getItem("smartMoneyURL") ||
"https://YOUR-RENDER-URL.onrender.com";
let soundOn = false;
let previousSignals = new Set();

document.getElementById("api").value = BASE;

function saveURL(){
  BASE = document.getElementById("api").value.trim().replace(/\/$/,"");
  localStorage.setItem("smartMoneyURL",BASE);
  refreshAll();
}

function toggleSound(){
  soundOn = !soundOn;
  document.getElementById("soundBtn").textContent =
    "Sound: " + (soundOn ? "ON" : "OFF");
}

async function getAPI(path){
  const response = await fetch(BASE + path);
  if(!response.ok) throw new Error("HTTP " + response.status);
  return await response.json();
}

function getArray(data){
  if(Array.isArray(data)) return data;
  if(!data || typeof data !== "object") return [];
  for(const key of ["data","results","signals","indexes","items","history","news"]){
    if(Array.isArray(data[key])) return data[key];
  }
  return [];
}

function getName(x){
  return x.index || x.name || x.symbol || x.underlying || "INDEX";
}

function getSignal(x){
  return x.signal || x.type || x.direction || x.action || "NO SIGNAL";
}

function playAlert(){
  if(!soundOn) return;
  try{
    const audio = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.frequency.value = 850;
    gain.gain.value = 0.15;
    oscillator.start();
    oscillator.stop(audio.currentTime + 0.35);
  }catch(e){}
}

function renderIndexes(data){
  const items = getArray(data);
  const root = document.getElementById("indexes");
  if(!items.length){
    root.innerHTML = '<div class="card">No index data returned by API.</div>';
    return;
  }
  root.innerHTML = items.map(x=>{
    const name = getName(x);
    const price = x.price ?? x.ltp ?? x.lastPrice ?? x.close ?? "--";
    const signal = getSignal(x);
    const bullish = /BUY|BULL|UP/i.test(signal);
    const bearish = /SELL|BEAR|DOWN/i.test(signal);
    return `<div class="card">
      <h3>${name}</h3>
      <div class="price">${price}</div>
      <p class="${bullish?'green':bearish?'red':'yellow'}">${signal}</p>
      <div class="muted">RSI: ${x.rsi ?? "--"} | VWAP: ${x.vwap ?? "--"}</div>
      <div class="muted">Updated: ${x.updatedAt || x.time || "--"}</div>
    </div>`;
  }).join("");
}

function renderActive(data){
  const items = getArray(data);
  const root = document.getElementById("active");
  if(!items.length){
    root.innerHTML = "No active signals currently.";
    return;
  }
  root.innerHTML = items.map(x=>{
    const signal = getSignal(x);
    const bearish = /SELL|BEAR/i.test(signal);
    const key = (x.id || "") + getName(x) + signal + (x.entry || "");
    if(!previousSignals.has(key)){
      if(previousSignals.size) playAlert();
      previousSignals.add(key);
    }
    return `<div class="card ${bearish?'badSignal':'signal'}">
      <h3>${getName(x)} — ${signal}</h3>
      <div>Option: ${x.option || x.optionSymbol || x.tradingSymbol || "--"}</div>
      <div>Entry: ${x.entry ?? x.entryPrice ?? "--"}</div>
      <div>Stop Loss: ${x.stopLoss ?? x.sl ?? "--"}</div>
      <div>Target 1: ${x.target1 ?? "--"} | Target 2: ${x.target2 ?? "--"}</div>
      <div class="muted">Time: ${x.time || x.timestamp || "--"}</div>
    </div>`;
  }).join("");
}

function renderScan(data){
  const items = getArray(data);
  const root = document.getElementById("scan");
  if(!items.length){
    root.textContent = JSON.stringify(data,null,2);
    return;
  }
  root.innerHTML = items.map(x=>{
    const conditions = x.conditions || x.checks || {};
    let rows = "";
    if(Array.isArray(conditions)){
      rows = conditions.map((c,i)=>`
        <div class="condition"><span>${c.name || "Condition "+(i+1)}</span>
        <b class="${c.met || c.pass ? 'green':'red'}">${c.met || c.pass ? 'PASS':'FAIL'}</b></div>`).join("");
    }else{
      rows = Object.entries(conditions).map(([k,v])=>`
        <div class="condition"><span>${k}</span>
        <b class="${v===true?'green':v===false?'red':'yellow'}">${typeof v==="object"?JSON.stringify(v):String(v)}</b></div>`).join("");
    }
    return `<div class="card">
      <h3>${getName(x)} — ${getSignal(x)}</h3>
      <div class="muted">Matched: ${x.matchCount ?? x.matches ?? "--"} / 6</div>
      ${rows || '<div class="muted">Condition details not provided by API.</div>'}
    </div>`;
  }).join("");
}

function renderNews(data){
  const items = getArray(data);
  const root = document.getElementById("news");
  if(!items.length){
    root.textContent = "No news data available.";
    return;
  }
  root.innerHTML = items.map(x=>{
    const type = String(x.type || x.sentiment || x.category || "").toUpperCase();
    const good = /GOOD|POSITIVE|BULL/i.test(type);
    const bad = /BAD|NEGATIVE|BEAR/i.test(type);
    return `<div class="news">
      <b class="${good?'green':bad?'red':'yellow'}">${type || "NEWS"}</b><br>
      ${x.title || x.headline || x.text || "News item"}<br>
      <span class="muted">${x.time || x.publishedAt || ""}</span>
    </div>`;
  }).join("");
}

function renderHistory(data){
  const items = getArray(data);
  document.getElementById("history").innerHTML = items.length ?
    items.map(x=>`<tr>
      <td>${x.time || x.timestamp || "--"}</td>
      <td>${getName(x)}</td>
      <td>${getSignal(x)}</td>
      <td>${x.entry ?? x.entryPrice ?? "--"}</td>
      <td>${x.status || "--"}</td>
    </tr>`).join("") :
    '<tr><td colspan="5">No signal history.</td></tr>';
}

async function load(path,render){
  try{
    const data = await getAPI(path);
    render(data);
    return true;
  }catch(e){
    console.error(path,e);
    return false;
  }
}

async function refreshAll(){
  document.getElementById("connection").textContent = "Checking server...";
  try{
    const status = await getAPI("/health");
    document.getElementById("connection").textContent =
      "🟢 SERVER CONNECTED — " + (status.status || "ONLINE");
  }catch(e){
    document.getElementById("connection").textContent =
      "🔴 SERVER ERROR — Check Render URL / server";
  }

  await Promise.all([
    load("/api/scan",renderIndexes),
    load("/api/signals/active",renderActive),
    load("/api/scan/latest",renderScan),
    load("/api/news",renderNews),
    load("/api/signals/history",renderHistory)
  ]);
}

refreshAll();
setInterval(refreshAll,15000);
</script>
</body>
</html>
