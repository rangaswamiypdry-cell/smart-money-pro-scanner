
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART MONEY PRO V5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101d;color:#eaf1ff;font-family:Arial,sans-serif}
header{padding:18px 15px;background:#0c1728;border-bottom:1px solid #263a54}
h1{font-size:25px;color:#42d5fa;margin:0}
.sub{color:#9aabc2;margin-top:8px;font-size:13px}
#status{font-size:12px;margin-top:10px;color:#ffca65}
main{padding:14px;max-width:1100px;margin:auto}
.top{display:flex;gap:8px;margin-bottom:14px}
input,button{border:1px solid #344862;border-radius:9px;padding:12px;background:#142238;color:white}
input{width:100%;min-width:0}
button{background:#087fbd;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#111e31;border:1px solid #2b405b;border-radius:18px;padding:14px;min-width:0}
.card h2{font-size:17px;margin:0 0 12px;color:#dceaff}
.price{font-size:28px;font-weight:bold;margin:8px 0}
.pill{display:inline-block;padding:7px 12px;border-radius:20px;font-weight:bold;font-size:12px;background:#493b18;color:#ffda77}
.buy{background:#123f35;color:#50e4ad}
.sell{background:#4b2534;color:#ff8ca5}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
.metric{background:#19283d;border-radius:15px;padding:11px;min-width:0}
.metric span{display:block;color:#9aabc2;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.metric b{display:block;font-size:17px;margin-top:5px;overflow-wrap:anywhere}
.strength{font-size:17px!important;color:#fff}
.conditions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.condition{background:#19283d;border-radius:12px;padding:9px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.pass{color:#42d5a6}
.fail{color:#ef91aa}
.section-title{font-size:20px;margin:25px 0 12px}
.signal{border-left:4px solid #39d6a2;margin-bottom:10px}
.signal.bear{border-left-color:#fa657f}
.muted{font-size:12px;color:#9aabc2}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:10px 6px;border-bottom:1px solid #293d58;text-align:left}
th{color:#42d5fa}
.scroll{overflow-x:auto}
.news{padding:10px 0;border-bottom:1px solid #293d58;font-size:13px}
@media(max-width:420px){
 main{padding:9px}
 .grid{gap:8px}
 .card{padding:10px;border-radius:15px}
 .price{font-size:23px}
 .metric{padding:9px}
 .metric span{font-size:12px}
 .metric b{font-size:15px}
 .condition{padding:8px 6px;font-size:11px}
}
</style>
</head>
<body>
<header>
<h1>⚡ SMART MONEY PRO V5</h1>
<div class="sub">FOUR INDEX CE / PE OPTIONS SCANNER</div>
<div id="status">Connecting...</div>
</header>

<main>
<div class="top">
<input id="server" placeholder="Enter your Render server URL">
<button onclick="connect()">CONNECT</button>
</div>

<div class="grid" id="indexes">
<div class="card">Loading indexes...</div>
</div>

<h2 class="section-title">🚨 STRONG OPTION SELL SIGNALS</h2>
<div id="active">Loading signals...</div>

<h2 class="section-title">📰 LIVE MARKET NEWS</h2>
<div class="card" id="news">Loading news...</div>

<h2 class="section-title">📜 SIGNAL HISTORY</h2>
<div class="card scroll">
<table>
<thead><tr><th>Time</th><th>Index</th><th>Signal</th><th>Entry</th><th>Status</th></tr></thead>
<tbody id="history"><tr><td colspan="5">Loading...</td></tr></tbody>
</table>
</div>
</main>

<script>
let BASE = localStorage.getItem("smartMoneyServer") || "";
let soundEnabled = false;
let knownSignals = new Set();

document.getElementById("server").value = BASE;

function connect(){
 BASE=document.getElementById("server").value.trim().replace(/\/+$/,"");
 localStorage.setItem("smartMoneyServer",BASE);
 refresh();
}

async function api(path){
 if(!BASE) throw Error("Enter your Render URL");
 const r=await fetch(BASE+path);
 if(!r.ok) throw Error("HTTP "+r.status);
 return r.json();
}

function arr(d){
 if(Array.isArray(d)) return d;
 if(!d || typeof d!=="object") return [];
 for(const k of ["indexes","data","results","items","signals","history","news"])
  if(Array.isArray(d[k])) return d[k];
 return [];
}

function val(o,keys,def="--"){
 for(const k of keys){
  if(o && o[k]!==undefined && o[k]!==null) return o[k];
 }
 return def;
}

function name(o){
 return val(o,["index","name","symbol","underlying","indexName"],"INDEX");
}

function signal(o){
 return String(val(o,["signal","action","direction","recommendation"],"WAIT"));
}

const bearKeys=[
 ["bearishPriceDirection","priceDirection"],
 ["futuresOIIncrease","bearishOIIncrease"],
 ["volumeSpike","bearishVolumeSpike"],
 ["rsiWeak","bearishRSI"],
 ["belowVWAP","bearishBelowVWAP"],
 ["strongBearishCandle","bearishCandle"]
];

const bullKeys=[
 ["bullishPriceDirection","priceDirection"],
 ["futuresOIIncrease","bullishOIIncrease"],
 ["volumeSpike","bullishVolumeSpike"],
 ["rsiStrong","bullishRSI"],
 ["aboveVWAP","bullishAboveVWAP"],
 ["strongBullishCandle","bullishCandle"]
];

function isPass(v){
 if(v===true || v===1 || v==="PASS") return true;
 if(v && typeof v==="object") return !!(v.pass ?? v.met ?? v.value);
 return false;
}

function conditionValue(o,keys){
 for(const k of keys){
  if(o.conditions && o.conditions[k]!==undefined) return o.conditions[k];
  if(o[k]!==undefined) return o[k];
 }
 return false;
}

function renderCondition(o,keys,label){
 const v=conditionValue(o,keys);
 const ok=isPass(v);
 return `<div class="condition ${ok?'pass':'fail'}">
 ${ok?'✓':'✕'} ${label}
 </div>`;
}

function renderCard(o){
 const bear=Number(val(o,["bearCount","bearStrength","bearishCount"],0));
 const bull=Number(val(o,["bullCount","bullStrength","bullishCount"],0));
 const s=signal(o);
 const price=val(o,["price","ltp","lastPrice","close"]);
 const rsi=val(o,["rsi","RSI"]);
 const vwap=val(o,["vwap","VWAP"]);
 const volume=val(o,["volumeRatio","volumeMultiplier","volRatio"]);
 const oi=val(o,["futuresOIChange","oiChange","oiChangePercent"]);
 const status=/SELL|BUY/i.test(s)?s:"WAIT";
 const cls=/SELL|BEAR/i.test(s)?"sell":/BUY|BULL/i.test(s)?"buy":"";

 return `<div class="card">
 <h2>${name(o)}</h2>
 <div class="price">${price}</div>
 <span class="pill ${cls}">${status}</span>

 <div class="metrics">
 <div class="metric"><span>RSI</span><b>${rsi}</b></div>
 <div class="metric"><span>VWAP</span><b>${vwap}</b></div>
 <div class="metric"><span>Volume Ratio</span><b>${volume}${typeof volume==="number"?'x':''}</b></div>
 <div class="metric"><span>Futures OI Change</span><b>${oi}</b></div>
 <div class="metric"><span>Bear Strength</span><b class="strength">${bear}/6</b></div>
 <div class="metric"><span>Bull Strength</span><b class="strength">${bull}/6</b></div>
 </div>

 <div class="conditions">
 ${renderCondition(o,["bearishPriceDirection","bearPriceDirection"],"bearish · priceDirection")}
 ${renderCondition(o,["futuresOIIncrease","bearishOIIncrease"],"bearish · futuresOIIncrease")}
 ${renderCondition(o,["volumeSpike","bearishVolumeSpike"],"bearish · volumeSpike")}
 ${renderCondition(o,["rsiWeak","bearishRSI"],"bearish · rsiWeak")}
 ${renderCondition(o,["belowVWAP","bearishBelowVWAP"],"bearish · belowVWAP")}
 ${renderCondition(o,["strongBearishCandle","bearishCandle"],"bearish · strongBearishCandle")}
 ${renderCondition(o,["bullishPriceDirection","bullPriceDirection"],"bullish · priceDirection")}
 ${renderCondition(o,["bullishOIIncrease"],"bullish · futuresOIIncrease")}
 ${renderCondition(o,["bullishVolumeSpike"],"bullish · volumeSpike")}
 ${renderCondition(o,["rsiStrong","bullishRSI"],"bullish · rsiStrong")}
 ${renderCondition(o,["aboveVWAP","bullishAboveVWAP"],"bullish · aboveVWAP")}
 ${renderCondition(o,["strongBullishCandle","bullishCandle"],"bullish · strongBullishCandle")}
 </div>
 </div>`;
}

function renderIndexes(d){
 const items=arr(d);
 document.getElementById("indexes").innerHTML=items.length?
 items.map(renderCard).join(""):"No index data received.";
}

function renderActive(d){
 const items=arr(d);
 const root=document.getElementById("active");
 if(!items.length){root.innerHTML='<div class="card">No active option sell signals.</div>';return;}
 root.innerHTML=items.map(o=>{
  const s=signal(o);
  const key=String(val(o,["id","signalId"],""))+name(o)+s+val(o,["entry","entryPrice"],"");
  if(!knownSignals.has(key)){
   if(knownSignals.size) alertSound();
   knownSignals.add(key);
  }
  return `<div class="card signal ${/SELL|BEAR/i.test(s)?'bear':''}">
  <h2>${name(o)} — ${s}</h2>
  <p>Option: ${val(o,["optionSymbol","option","tradingSymbol"])}</p>
  <p>Entry: ${val(o,["entry","entryPrice"])}</p>
  <p>Stop Loss: ${val(o,["stopLoss","sl"])}</p>
  <p>Target 1: ${val(o,["target1"])} | Target 2: ${val(o,["target2"])}</p>
  <div class="muted">${val(o,["time","timestamp"])}</div>
  </div>`;
 }).join("");
}

function renderNews(d){
 const items=arr(d);
 document.getElementById("news").innerHTML=items.length?
 items.map(n=>{
  const type=String(val(n,["type","sentiment","category"],"NEWS")).toUpperCase();
  const c=/GOOD|POSITIVE|BULL/i.test(type)?"pass":/BAD|NEGATIVE|BEAR/i.test(type)?"fail":"";
  return `<div class="news"><b class="${c}">${type}</b><br>
  ${val(n,["title","headline","text"],"News update")}
  <div class="muted">${val(n,["time","publishedAt"],"")}</div></div>`;
 }).join(""):"No news available.";
}

function renderHistory(d){
 const items=arr(d);
 document.getElementById("history").innerHTML=items.length?
 items.map(o=>`<tr>
 <td>${val(o,["time","timestamp"])}</td>
 <td>${name(o)}</td><td>${signal(o)}</td>
 <td>${val(o,["entry","entryPrice"])}</td>
 <td>${val(o,["status"])}</td></tr>`).join("")
 :'<tr><td colspan="5">No signal history.</td></tr>';
}

function alertSound(){
 if(!soundEnabled)return;
 try{
  const a=new AudioContext(),osc=a.createOscillator(),gain=a.createGain();
  osc.connect(gain);gain.connect(a.destination);
  osc.frequency.value=850;gain.gain.value=.15;
  osc.start();osc.stop(a.currentTime+.4);
 }catch(e){}
}

async function refresh(){
 document.getElementById("status").textContent="Checking server...";
 try{
  await api("/health");
  document.getElementById("status").textContent="🟢 SERVER CONNECTED";
 }catch(e){
  document.getElementById("status").textContent="🔴 SERVER ERROR: "+e.message;
  return;
 }

 const tasks=[
  ["/api/scan",renderIndexes],
  ["/api/signals/active",renderActive],
  ["/api/news",renderNews],
  ["/api/signals/history",renderHistory]
 ];
 await Promise.all(tasks.map(async ([p,fn])=>{
  try{fn(await api(p));}
  catch(e){console.error(p,e);}
 }));
}

refresh();
setInterval(refresh,15000);
</script>
</body>
</html>
